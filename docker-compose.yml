services:
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    env_file: .env.example
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env.example
    command: /bin/sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app
      - internal

  worker-ingestion:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: .env.example
    command: celery -A ingestion.worker:celery_app worker --loglevel=INFO --queues=ingestion
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  worker-geospatial:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: .env.example
    command: celery -A geospatial.worker:celery_app worker --loglevel=INFO --queues=geospatial
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  worker-predictions:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: .env.example
    command: celery -A predictions.worker:celery_app worker --loglevel=INFO --queues=predictions
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgis/postgis:16-3.4
    env_file: .env.example
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    env_file: .env.example
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio-init:
    image: minio/mc:RELEASE.2024-07-15T17-46-06Z
    env_file: .env.example
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "local/$$MINIO_BUCKET_RAW"
    networks:
      - internal

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  app:
  internal:
    internal: true
